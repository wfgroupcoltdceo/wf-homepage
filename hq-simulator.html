<style>
  body { font-family: 'Pretendard Variable', Pretendard, sans-serif; -webkit-font-smoothing: antialiased; background: #f6f6f7; }
  .hero-bg { background: radial-gradient(ellipse at top right, rgba(199,201,205,.15) 0%, transparent 50%), linear-gradient(135deg, #0E0E0E 0%, #181818 50%, #000 100%); }
  .gradient-text { background: linear-gradient(135deg,#7B7B7D 0%,#A8AAAB 30%,#FAFCFD 50%,#A8AAAB 70%,#5F6169 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .sim-wrap { max-width: 80rem; margin: 0 auto; padding: 0 1.5rem; }
  .sim-panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 1.5rem; padding: 1.75rem; }
  .sim-select { border: 1.5px solid #d1d5db; border-radius: .75rem; padding: .5rem .8rem; font-size: .9rem; font-weight: 600; color: #181818; background: #fff; outline: none; }
  .model-btn { padding: .7rem 0; border-radius: .8rem; font-weight: 800; font-size: .95rem; border: 1.5px solid #d1d5db; color: #444; background: #fff; cursor: pointer; transition: all .15s; }
  .model-btn.on { color: #fff; border-color: #181818; background: linear-gradient(135deg,#302F2F 0%,#181818 100%); }
  .cards-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .8rem; margin: 1.25rem 0; }
  @media (min-width: 1024px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }
  .kcard { background: #fff; border: 1px solid #e5e7eb; border-radius: 1.25rem; padding: 1.15rem 1.3rem; }
  .kcard .t { font-size: .72rem; font-weight: 700; color: #8A8B8E; letter-spacing: .06em; }
  .kcard .v { font-size: 1.4rem; font-weight: 800; color: #181818; margin-top: .3rem; }
  .kcard .s { font-size: .74rem; color: #666; margin-top: .3rem; overflow-wrap: anywhere; }
  .kcard.dark { border: none; color: #fff; background: linear-gradient(160deg,#302F2F 0%,#181818 70%,#0E0E0E 100%); }
  .kcard.dark .t { color: #C7C9CD; } .kcard.dark .v { color: #fff; } .kcard.dark .s { color: #A8AAAB; }
  .sim-grid2 { display: grid; grid-template-columns: minmax(0,1fr); gap: 1.25rem; }
  @media (min-width: 1024px) { .sim-grid2 { grid-template-columns: 1fr 1fr; } }
  /* 가정 설정 패널 (매출 시뮬레이터와 동일 레이아웃) */
  .fgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .8rem; }
  @media (min-width: 700px) { .fgrid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
  @media (min-width: 1100px) { .fgrid { grid-template-columns: repeat(6, minmax(0,1fr)); } }
  .fld { min-width: 0; }
  .flab { font-size: .68rem; font-weight: 800; color: #8A8B8E; margin-bottom: .28rem; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .finp { position: relative; }
  .finp .sim-select { width: 100%; }
  .funit { position: absolute; right: .6rem; top: 50%; transform: translateY(-50%); font-size: .7rem; color: #9aa; font-weight: 700; pointer-events: none; }
  .fnote { font-size: .74rem; color: #777; margin-top: .8rem; line-height: 1.55; }
  .mini-btn { font-size: .72rem; font-weight: 800; border: 1.5px solid #d1d5db; background: #fff; color: #181818; border-radius: .6rem; padding: .4rem .75rem; cursor: pointer; white-space: nowrap; }
  .mini-btn:hover { border-color: #181818; }
  .mini-btn.on { background: #181818; color: #fff; border-color: #181818; }
  .grp { margin-top: 1rem; padding-top: .9rem; border-top: 1px solid #eee; }
  .grp:first-child { margin-top: .9rem; }
  .grp-t { font-size: .74rem; font-weight: 800; color: #181818; margin-bottom: .6rem; letter-spacing: .01em; }
  /* 숫자는 고정폭(tabular-nums) — 자릿수가 같으면 폭도 같게 보이도록 */
  .sim-table { width: 100%; border-collapse: collapse; font-size: .8rem; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .sim-table th { background: #181818; color: #fff; font-weight: 700; padding: .55rem .5rem; text-align: right; white-space: nowrap; position: sticky; top: 0; }
  .sim-table th:first-child, .sim-table th:nth-child(2) { text-align: center; }
  .sim-table td { padding: .45rem .5rem; text-align: right; border-bottom: 1px solid #eee; white-space: nowrap; color: #302F2F; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .sim-table td:first-child, .sim-table td:nth-child(2) { text-align: center; color: #8A8B8E; font-weight: 600; }
  .sim-table tr.y2 td { background: #fafafa; }
  .sim-table td .mm { display: block; font-size: .64rem; font-weight: 700; color: #8A8B8E; margin-top: .1rem; }
  .sim-table th .hs { display: block; font-size: .64rem; font-weight: 600; color: #A8AAAB; }
  .hq-row .num, .fnote .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .hq-row { display: grid; grid-template-columns: 1fr auto; gap: .2rem .8rem; padding: .5rem 0; border-bottom: 1px solid #f0f0f0; font-size: .85rem; }
  .hq-row span:first-child { color: #555; font-weight: 600; }
  .hq-row .num { font-weight: 700; text-align: right; }
  .hq-row .note { grid-column: 1 / -1; font-size: .7rem; color: #999; }
  .hq-row.strong { background: #FCE4D6; border-radius: .5rem; padding: .55rem .6rem; border: none; margin-top: .3rem; }
  .hq-row.strong span { font-weight: 800; }
  .gate-input { width: 100%; border: 1.5px solid rgba(255,255,255,.3); border-radius: .8rem; padding: .8rem 1rem; font-size: 1rem; background: rgba(255,255,255,.08); color: #fff; outline: none; text-align: center; letter-spacing: .2em; }
  .gate-input:focus { border-color: #A8AAAB; }
  .gate-btn { width: 100%; margin-top: .8rem; padding: .8rem 0; border-radius: .8rem; font-weight: 800; border: none; cursor: pointer; background: linear-gradient(135deg,#7B7B7D 0%,#A8AAAB 40%,#D3D4D7 50%,#A8AAAB 60%,#5F6169 100%); color: #181818; }
  .font-extrabold { font-weight: 800; }
  .hdlink { font-size: .7rem; color: #A8AAAB; text-decoration: none; border: 1px solid #3a3a3a; border-radius: .5rem; padding: .35rem .7rem; font-weight: 700; }
  .hdlink:hover { color: #fff; border-color: #7B7B7D; }
</style>

    var enc = new TextEncoder();
    var keyMat = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(data.s), iterations: 200000, hash: "SHA-256" },
      keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(data.i) }, key, b64(data.c));
    return new TextDecoder().decode(plain);
  }
  function boot(code) {
    (0, eval)(code);
    document.getElementById("gate").style.display = "none";
    document.getElementById("app-wrap").style.display = "block";
    window.renderHQApp(document.getElementById("app"));
  }
  async function tryUnlock() {
    var pass = document.getElementById("pass").value;
    var msg = document.getElementById("gate-msg");
    if (!pass) { msg.textContent = "접근 코드를 입력하세요."; return; }
    msg.textContent = "확인 중...";
    try {
      var code = await decode(pass);
      try { sessionStorage.setItem(SKEY, pass); } catch (e) {}
      boot(code);
    } catch (e) {
      msg.textContent = "접근 코드가 올바르지 않습니다.";
    }
  }
  document.getElementById("unlock").addEventListener("click", tryUnlock);
  document.getElementById("pass").addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });

  /* 같은 브라우저 세션에서 이미 잠금을 해제했다면 다시 묻지 않음
   * (접근 코드는 sessionStorage에만 보관 · 브라우저를 닫으면 사라짐) */
  (async function () {
    var saved = null;
    try { saved = sessionStorage.getItem(SKEY); } catch (e) {}
    if (!saved) return;
    var gate = document.getElementById("gate"), msg = document.getElementById("gate-msg");
    gate.style.visibility = "hidden";
    msg.textContent = "자동 잠금 해제 중...";
    try {
      boot(await decode(saved));
    } catch (e) {
      try { sessionStorage.removeItem(SKEY); } catch (e2) {}
      msg.textContent = "";
      gate.style.visibility = "visible";
    }
  })();
})();
</script>
